plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '3.5.0'
}

group = 'fr.siovision'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Security fixes released after the Spring Boot 4.1.1 dependency baseline.
ext["tomcat.version"] = "11.0.26"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.security:spring-security-webauthn'
    implementation 'com.webauthn4j:webauthn4j-core:0.31.11.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-73:3.16.0'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation('software.amazon.awssdk:s3:2.55.11') {
        // Seul le client synchrone (Apache HTTP) est utilisé : Netty inutile et source de CVE
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "com.jayway.jsonpath:json-path:2.10.0"
    testImplementation "org.assertj:assertj-core:3.27.7"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// SBOM CycloneDX des dépendances embarquées dans le jar : ./gradlew cyclonedxBom
tasks.named('cyclonedxDirectBom') {
    includeConfigs = ['productionRuntimeClasspath']
}
