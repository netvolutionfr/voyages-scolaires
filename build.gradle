plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '3.4.1'
}

group = 'fr.siovision'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Spring Boot 3.5.16 est la dernière version OSS de la 3.5 : on force les correctifs
// de sécurité publiés depuis. À retirer lors de la migration vers Spring Boot 4.
ext['tomcat.version'] = '10.1.60'
ext['jackson-bom.version'] = '2.21.7'
ext['postgresql.version'] = '42.7.13'
ext['log4j2.version'] = '2.25.5'
ext['commons-lang3.version'] = '3.20.0'
ext['httpclient5.version'] = '5.6.4'
ext['httpcore5.version'] = '5.4.3'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'com.webauthn4j:webauthn4j-core:0.29.7.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.16.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation('software.amazon.awssdk:s3:2.55.3') {
        // Seul le client synchrone (Apache HTTP) est utilisé : Netty inutile et source de CVE
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "com.jayway.jsonpath:json-path:2.10.0"
    testImplementation "org.assertj:assertj-core:3.27.7"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// SBOM CycloneDX des dépendances embarquées dans le jar : ./gradlew cyclonedxBom
tasks.named('cyclonedxDirectBom') {
    includeConfigs = ['productionRuntimeClasspath']
}
