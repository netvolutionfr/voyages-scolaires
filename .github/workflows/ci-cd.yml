name: CI/CD - Spring Boot API (Docker + Compose)

on:
  push:
    branches: ["master"]
  pull_request:              # build + scan Trivy uniquement, sans push ni déploiement
    branches: ["master"]
  workflow_dispatch:

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push vers GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Le Dockerfile build avec -x test : les tests tournent ici
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew test --no-daemon

      # Multi-arch optionnel : commente si inutile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build local d'abord : l'image n'est poussée que si le scan Trivy passe
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: voyages:scan
          build-args: |
            APP_VERSION=${{ github.sha }}
          provenance: false

      # trivy-action épinglé par SHA (v0.36.0) : ses tags ont déjà été compromis
      - name: Scan vulnérabilités (bloque sur CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: voyages:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: SBOM CycloneDX de l'image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: voyages:scan
          format: cyclonedx
          output: sbom-image.cdx.json
          skip-setup-trivy: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom-image.cdx.json

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          provenance: false

  deploy_to_server:
    runs-on: ubuntu-latest
    needs: build_and_push_image
    if: github.event_name != 'pull_request'
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull & restart via Docker Compose
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}  # ex: /srv/myapp
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} && \
            cd ${DEPLOY_DIR} && \
            docker compose pull && \
            docker compose up -d && \
            docker image prune -f"
